[package]
name = "qingniao"
version = "0.4.0"
description = "青鸟 · 飞书消息助手 — 向飞书自定义机器人发送各种格式消息"
authors = ["fuxinf"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qingniao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘/菜单栏能力的唯一启用方式。
# 注意：不要在 tauri.conf.json 配置 app.trayIcon——Tauri 会在 initialize_plugins()
# 之前依据该配置自动创建 tray，绕过 single-instance 的主实例判定（见设计文档 §8.1、§13.1 事实 15）。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# 退出二次确认用非阻塞原生对话框（§7.2.2 第 2 步）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart"] }
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "local-offset"] }
# std + alloc：`log::set_boxed_logger` 需要 alloc feature（0.4.34 默认特性不含它）
log = { version = "0.4", features = ["std", "alloc"] }
# ===== 文件传输依赖基线（D22，docs/文件传输功能设计文档.md §11.1）=====
# K / app_secret 存 OS 凭据库（macOS Keychain / Windows Credential Manager）
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# payload 信封与分片 AEAD（AES-256-GCM）
aes-gcm = "0.10"
# 文件/payload 指纹、kid
sha2 = "0.10"
# webhook HMAC-SHA256 签名（从 main.js 下沉到后端）
hmac = "0.12"
# 127.0.0.1 双路由 loopback 服务（D14；与 dock-tray 阶段 B 真实 listener 同一实现）
tiny_http = "0.12"
# K/DEK/nonce/handle 的 CSPRNG
rand = "0.8"
# 文件名 Unicode NFC 规范化（P2-3）
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# 仅用于恢复 Dock 图标：切回 Regular 后系统会丢失应用图标（见 tray.rs restore_dock_icon）。
# 与 tauri 传递引入的版本保持一致，不产生重复编译。
objc2 = "0.6"
objc2-app-kit = "0.3"
