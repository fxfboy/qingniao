[package]
name = "qingniao-cli"
version = "0.6.1"
edition = "2021"
description = "青鸟 CLI：向飞书自定义机器人发送文本/富文本/图片/卡片消息（与 APP 共用 qingniao-core）"

[[bin]]
name = "qingniao-cli"
path = "src/main.rs"

[dependencies]
qingniao-core = { path = "../qingniao-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 最小 stderr logger（清理方案 v0.3 §5.4）：core 的 log 宏在本 crate 需要直接可见
log = "0.4"
