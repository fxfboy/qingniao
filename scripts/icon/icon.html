<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tileGrad" cx="20%" cy="15%" r="120%">
      <stop offset="0%" stop-color="#0fb89a"/>
      <stop offset="50%" stop-color="#2a9e85"/>
      <stop offset="100%" stop-color="#107460"/>
    </radialGradient>
    <clipPath id="birdClip">
      <rect x="0" y="0" width="24" height="24"/>
    </clipPath>
  </defs>
  <!-- macOS icon tile: 824x824 centered, corner radius ~22% -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tileGrad)"/>
  <!-- subtle inner bottom shade, mimics .logo box-shadow -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="none" stroke="#0d4a3f" stroke-opacity="0.28" stroke-width="10"/>
  <!-- in-app bird: same path as src/index.html .logo svg, centered -->
  <g transform="translate(282,282) scale(19.1667)" clip-path="url(#birdClip)">
    <path d="M22 5.5c-1.2.5-2.4.9-3.7 1a5.4 5.4 0 0 0-9.4 4.8C4.9 11.1 2 9.4 0 6.7c-1 3 .1 6.4 2.8 8.2-.9 0-1.8-.3-2.6-.7 0 3 2.1 5.5 5 6.1-.9.2-1.8.3-2.6.1.7 2.4 3 4.2 5.7 4.3A11 11 0 0 1 0 27.5"
      fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</body>
</html>
